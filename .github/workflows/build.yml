# CI and release builds (§16.1): check → build per OS → package → sign → publish to the WorkSuite Update Center.
#
# A release is a pushed v* tag (which must be package.json's version) or a manual run on the STABLE channel
# (WS_RELEASE=1). A release fails without its macOS and Windows signing secrets; any other build packages unsigned
# with a warning. A tag or a manual run then publishes the installers to the Update Center (job `publish`), which stops
# at READY_FOR_TEST for people to approve. docs/RELEASING.md; the steps' logic is build/release-ci.mjs.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: Update Center channel to publish to (STABLE also makes this a release build that must be signed)
        default: BETA
        type: choice
        options: [BETA, DEV, INTERNAL, STABLE]

permissions:
  contents: read

env:
  # The channel a tag or a manual run publishes to: BETA unless a manual run picks another.
  WS_CHANNEL: ${{ inputs.channel || 'BETA' }}
  # A release build: a v* tag, or a manual run for STABLE. build/mac-signing.cjs (as WS_RELEASE_BUILD) and
  # build/release-ci.mjs then refuse to go on unsigned.
  WS_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.channel == 'STABLE')) && '1' || '0' }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # ubuntu-24.04, not ubuntu-latest: Electron runs under xvfb here on that image's libraries.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: The tag is the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node build/release-ci.mjs tag "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The unit tests, with line coverage (v8) held to the floors in vitest.config.ts (audit D-G07).
      - run: xvfb-run -a npm run test:coverage
      - name: Coverage report
        if: ${{ !cancelled() }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
      - run: npm audit --omit=dev --audit-level=high

  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac
          - os: windows-latest
            target: --win
          # ubuntu-24.04, not ubuntu-latest: the .deb/.rpm/AppImage take that image's packaging tools and glibc
          # baseline. Move it on only after checking the packages built on the newer image (audit D-G25).
          - os: ubuntu-24.04
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Signing secrets
        # Before anything is built: a release without its platform's signing fails here, saying what is missing.
        shell: bash
        run: node build/release-ci.mjs signing "$RUNNER_OS"
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - name: Policy key
        shell: bash
        env:
          MAIN_VITE_POLICY_PUBLIC_KEY: ${{ secrets.WS_POLICY_PUBLIC_KEY }}
        # A packaged build without a policy key applies no desktop policy at all unless the account has its own
        # discovery_key (POLICY_UNSIGNED_REFUSED, audit D-G05; docs/BACKEND.md "Signed policies"). Said here, not found later.
        run: |
          if [ -z "$MAIN_VITE_POLICY_PUBLIC_KEY" ]; then
            echo "::warning title=No policy key::WS_POLICY_PUBLIC_KEY is not set: this build refuses every unsigned desktop policy and applies none unless the account has its own discovery_key."
          fi
      - run: npm run build
        env:
          # electron-vite build exceeds Node's default ~2 GB heap and aborts with exit 134; macos-14 has 7 GB RAM.
          NODE_OPTIONS: --max-old-space-size=6144
          MAIN_VITE_POLICY_PUBLIC_KEY: ${{ secrets.WS_POLICY_PUBLIC_KEY }}
      - name: Package
        shell: bash
        # A secret that is not set arrives as an empty string, and electron-builder keeps an empty CSC_LINK
        # ("allow to specify as empty string") and then fails to read the project folder as a certificate
        # ("… not a file"). So an empty one is unset: no certificate means an unsigned build, as intended.
        run: |
          # A tagged release must be Developer ID-signed on macOS: build/mac-signing.cjs
          # fails it otherwise, because ad-hoc builds lose Accessibility on every update (worksuite-desktop#147).
          for v in CSC_LINK CSC_KEY_PASSWORD CSC_NAME WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          # Notarization reads APPLE_API_KEY as the path of the .p8 key (@electron/notarize); the secret holds the
          # key itself, so it is written to a file only this job can read.
          if [ -n "${APPLE_API_KEY:-}" ] && [ ! -f "$APPLE_API_KEY" ]; then
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID:-ci}.p8"
            (umask 077 && printf '%s\n' "$APPLE_API_KEY" > "$key")
            export APPLE_API_KEY="$key"
          fi
          npx electron-builder --config build/electron-builder.config.cjs ${{ matrix.target }} --publish never
        env:
          # macOS signing + notarization (Developer ID Application). Unset → an ad-hoc build, refused for releases.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.MAC_CSC_NAME }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # A release (WS_RELEASE: a v* tag, or the STABLE channel) must be Developer ID-signed: build/mac-signing.cjs.
          WS_RELEASE_BUILD: ${{ env.WS_RELEASE }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows: Authenticode certificate, or Azure Trusted Signing.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}
          # Linux: the WorkSuite APT/DNF repositories (worksuite-desktop#351) stay OFF until the repository is live.
          # Turn them on with the repository VARIABLES (not secrets: nothing here is private) WORKSUITE_LINUX_REPO=1
          # and WORKSUITE_REPO_GPG_PUBLIC_KEY (the ASCII-armoured public key). Unset, the .deb/.rpm add no package source.
          WORKSUITE_LINUX_REPO: ${{ vars.WORKSUITE_LINUX_REPO }}
          WORKSUITE_REPO_GPG_PUBLIC_KEY: ${{ vars.WORKSUITE_REPO_GPG_PUBLIC_KEY }}
      - name: Check the Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        # Read back from the files, as Windows will: a release's installers must carry a valid Authenticode
        # signature; any other build only lists what it has.
        run: |
          $bad = @()
          foreach ($f in Get-ChildItem release/*/* -Include *.exe,*.msi) {
            $s = Get-AuthenticodeSignature $f.FullName
            Write-Output "$($f.Name): $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { $bad += $f.Name }
          }
          if ($bad.Count -gt 0) {
            if ($env:WS_RELEASE -eq '1') { Write-Output "::error title=Unsigned installer::Not validly signed: $($bad -join ', ')"; exit 1 }
            Write-Output "::warning title=Unsigned installer::Not signed (not a release build): $($bad -join ', ')"
          }
      - name: Sign Linux packages (GPG)
        if: runner.os == 'Linux'
        shell: bash
        # Optional (audit D-G18): runs only when the LINUX_GPG_PRIVATE_KEY secret exists (ASCII-armoured private key;
        # LINUX_GPG_PASSPHRASE if it has one). The .rpm gets an embedded signature (rpmsign, checked by dnf/zypper
        # with gpgcheck); the .deb and the AppImage get a detached .asc beside them. docs/RELEASING.md "Signing Linux packages".
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$LINUX_GPG_PRIVATE_KEY" ]; then
            echo "::notice title=Linux packages unsigned::LINUX_GPG_PRIVATE_KEY is not set: the .deb, .rpm and AppImage are not GPG-signed."
            exit 0
          fi
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill all || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          pass="$GNUPGHOME/passphrase"
          printf '%s' "$LINUX_GPG_PASSPHRASE" > "$pass"
          key="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          [ -n "$key" ] || { echo "::error::LINUX_GPG_PRIVATE_KEY holds no secret key"; exit 1; }
          shopt -s nullglob
          for f in release/*/*.rpm; do
            rpmsign --addsign --define "_gpg_name $key" \
              --define "_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-file $pass" "$f"
            rpm -qp --qf '%{NAME}-%{VERSION}: %{RSAHEADER:pgpsig}\n' "$f"
          done
          for f in release/*/*.deb release/*/*.AppImage; do
            gpg --batch --yes --pinentry-mode loopback --passphrase-file "$pass" --local-user "$key" --armor --detach-sign "$f"
            gpg --batch --verify "$f.asc" "$f"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: worksuite-${{ runner.os }}
          path: |
            release/*/*.exe
            release/*/*.msi
            release/*/*.dmg
            release/*/*.pkg
            release/*/*.zip
            release/*/*.AppImage
            release/*/*.deb
            release/*/*.rpm
            release/*/*.asc
          if-no-files-found: error

  # The legacy `manifest` job (scripts/release-manifest.mjs, signed with WS_RELEASE_PRIVATE_KEY) is retired: the app
  # has asked the Update Center since it moved there, and reads no self-hosted manifest (electron/updater/keys.ts,
  # update-center.ts). docs/RELEASING.md §4.

  publish:
    # Tags and manual runs only; a run without the Update Center's secrets says so and publishes nothing.
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # One publish per channel at a time; a newer tag waits rather than cancelling an upload half-way.
    concurrency:
      group: update-center-${{ inputs.channel || 'BETA' }}
      cancel-in-progress: false
    env:
      # publish-release.mjs, from Livezen-Technologies/worksite-download at a reviewed commit. It is handed the CI
      # token and attestation key, so it is pinned; move UC_SCRIPT_REF (a repository variable) to take a newer one.
      UC_SCRIPT_REF: ${{ vars.UC_SCRIPT_REF || 'd5c23724f4e47a1e159cd36c3523793ea74643ae' }}
    steps:
      - name: Update Center secrets
        id: secrets
        shell: bash
        env:
          UC_CI_TOKEN: ${{ secrets.UC_CI_TOKEN }}
          UC_CI_KEY: ${{ secrets.UC_CI_KEY }}
          UC_SCRIPT_TOKEN: ${{ secrets.UC_SCRIPT_TOKEN }}
        run: |
          missing=()
          [ -n "$UC_CI_TOKEN" ] || missing+=(UC_CI_TOKEN)
          [ -n "$UC_CI_KEY" ] || missing+=(UC_CI_KEY)
          [ -n "$UC_SCRIPT_TOKEN" ] || missing+=(UC_SCRIPT_TOKEN)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning title=Not published::${missing[*]} not set: the build is not published to the Update Center (docs/RELEASING.md §4). Its installers are this run's artifacts."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
      - name: The publish script
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          repository: Livezen-Technologies/worksite-download
          ref: ${{ env.UC_SCRIPT_REF }}
          token: ${{ secrets.UC_SCRIPT_TOKEN }}
          path: .uc
          sparse-checkout: scripts/publish-release.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          # publish-release.mjs: Node 20, no dependencies.
          node-version: 20
      - uses: actions/download-artifact@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          pattern: worksuite-*
          path: dist
          merge-multiple: true
      - name: Publish to the Update Center (stops at READY_FOR_TEST)
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          UC_CI_TOKEN: ${{ secrets.UC_CI_TOKEN }}
          UC_CI_KEY: ${{ secrets.UC_CI_KEY }}
        run: |
          set -euo pipefail
          # The version, the patch as the build number, the channel, the commit, the CHANGELOG section as the notes,
          # and Windows x64, the universal DMG as macos:arm64 and macos:x64, and Linux x64 (build/release-ci.mjs).
          args_file="$RUNNER_TEMP/uc-args"
          node build/release-ci.mjs publish dist "$RUNNER_TEMP/release-notes.md" > "$args_file"
          mapfile -t args < "$args_file"
          echo "Publishing to $WS_CHANNEL:"; printf '  %s\n' "${args[@]}"
          node .uc/scripts/publish-release.mjs "${args[@]}"

  module-tags:
    # Each module release is tagged <module>/vX.Y.Z on main (docs/MODULES.md), as `npm run module -- tag --create`
    # makes them by hand. Idempotent: a tag that exists here or on origin is left as it is, and nothing is forced.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: module-tags
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create and push the missing module tags
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --tags --force origin
          before="$(git tag -l '*/v*' | sort)"
          node scripts/module.mjs tag --create
          created="$(comm -13 <(printf '%s\n' "$before") <(git tag -l '*/v*' | sort))"
          if [ -z "$created" ]; then echo "Every module version is tagged."; exit 0; fi
          while read -r t; do
            if git ls-remote --exit-code --tags origin "refs/tags/$t" > /dev/null; then
              echo "already on origin: $t"
            else
              git push origin "refs/tags/$t"
            fi
          done <<< "$created"
